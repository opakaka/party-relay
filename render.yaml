services:
  - type: web
    name: party-roulette-relay
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: python relay.py

  - type: cron
    name: keep-awake
    runtime: python
    plan: free
    schedule: "*/10 * * * *"
    startCommand: python -c "import urllib.request; urllib.request.urlopen('https://party-roulette-relay.onrender.com/health')"